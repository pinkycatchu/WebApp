<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修論・参考資料 - 試験体管理</title>
  <link rel="icon" href="images/labologo.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen pb-12">
  <script src="header.js"></script>

  <main class="container mx-auto px-4 py-6 max-w-4xl">
    <!-- 共有ドライブ・重要ドキュメント -->
    <section class="mb-8">
      <h2 class="text-xl font-bold text-stone-800 mb-4 border-b-2 border-amber-600 pb-2">リンク集</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- ドライブリンク -->
        <a href="https://drive.google.com/drive/folders/1MVJqZ2kxeXPh2wM7x15LnlSPZzBMnUSn?usp=sharing" target="_blank" class="bg-white p-4 rounded-xl shadow-sm hover:shadow-md border border-stone-200 transition duration-150 flex items-center">
          <div class="bg-amber-100 p-3 rounded-full mr-4">
            <span class="text-xl">📁</span>
          </div>
          <div>
            <h3 class="font-bold text-stone-800">修士論文ドライブ</h3>
          </div>
        </a>

        <!-- ドライブリンク -->
        <a href="https://drive.google.com/file/d/1AbDk-G0p7lG0p0jgdzla-CbK-ttGxINQ/view?usp=sharing" target="_blank" class="bg-white p-4 rounded-xl shadow-sm hover:shadow-md border border-stone-200 transition duration-150 flex items-center">
          <div class="bg-emerald-100 p-3 rounded-full mr-4">
            <span class="text-xl">📊</span>
          </div>
          <div>
            <h3 class="font-bold text-stone-800">試験計画書</h3>
          </div>
        </a>

      </div>
      <ul class="list-disc list-inside bg-white p-5 rounded-xl shadow-sm border border-stone-200 mt-4">
        <li>
          <a href="https://www.forest.go.jp/" target="_blank" class="text-amber-700 hover:underline">森林総合研究所HP</a>
        </li>
      </ul>
    </section>

    <!-- 2. ローカル Reference_list フォルダツリー（自動生成） -->
    <section class="mb-8">
      <h2 class="text-xl font-bold text-stone-800 mb-4 border-b-2 border-amber-600 pb-2">参考文献リスト</h2>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200">
        <!-- ここにフォルダツリーが自動描画されます -->
        <div id="reference-tree-container" class="text-sm">
          <div class="animate-pulse flex space-x-4">
            <div class="flex-1 space-y-4 py-1">
              <div class="h-4 bg-stone-200 rounded w-3/4"></div>
              <div class="h-4 bg-stone-200 rounded w-1/2"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwYhNRKqGiB4aZslbkChTbivspwoe7yUk0w8ikYX_dyG7dC2m6kBKrkyTFg6duDy_vAFg/exec";

    // ==========================================
    // GitHub APIを利用したフォルダツリー自動生成
    // ==========================================
    
    const GITHUB_USERNAME = "pinkycatchu"; 
    const GITHUB_REPO = "WebApp"; 
    const TARGET_FOLDER = "References_list";

    window.addEventListener('DOMContentLoaded', () => {
      // パスワードがない場合は index.html へ戻してログインさせる
      if (!window.appPassword) {
        alert("ログインが必要です。");
        window.location.href = "index.html";
        return;
      }
      const container = document.getElementById('reference-tree-container');
      loadGitHubFolder(TARGET_FOLDER, container);
    });

    // 再帰的にGitHubのフォルダの中身を取得してHTMLを描画する関数
    async function loadGitHubFolder(path, parentElement) {
      const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${path}`;
      
      try {
        const response = await fetch(url);
        
        if (response.status === 404) {
          parentElement.innerHTML = `<p class="text-stone-500 italic">⚠️ 指定されたフォルダ（${path}）が見つかりません。GitHubにアップロードされているか確認してください。</p>`;
          return;
        }
        
        if (!response.ok) throw new Error("API取得エラー");
        
        const data = await response.json();
        
        // 読み込み中アニメーションを消す（初回のみ）
        if (parentElement.id === 'reference-tree-container') {
          parentElement.innerHTML = ''; 
        }

        const ul = document.createElement('ul');
        ul.className = "pl-4 mt-2 space-y-2 border-l-2 border-stone-200";

        // ファイルとフォルダをソート（フォルダを上に）
        data.sort((a, b) => {
          if (a.type === b.type) return a.name.localeCompare(b.name);
          return a.type === 'dir' ? -1 : 1;
        });

        for (const item of data) {
          const li = document.createElement('li');
          
          if (item.type === 'dir') {
            // フォルダの場合（アイコン＋再帰呼び出し）
            li.innerHTML = `
              <div class="font-bold text-stone-700 flex items-center gap-1 cursor-pointer hover:text-amber-700 transition" onclick="this.nextElementSibling.classList.toggle('hidden')">
                <span class="text-lg">📁</span> ${item.name}
              </div>
              <div class="folder-content ml-2 hidden">
                 <!-- 子要素の読み込み用コンテナ -->
                 <div class="text-xs text-stone-400 pl-4 py-1">読み込み中...</div>
              </div>
            `;
            ul.appendChild(li);
            
            // フォルダの中身を再帰的に取得（非同期）
            const contentContainer = li.querySelector('.folder-content');
            loadGitHubFolder(item.path, contentContainer).then(() => {
              // 読み込み中テキストを削除
              if(contentContainer.firstElementChild && contentContainer.firstElementChild.textContent === '読み込み中...') {
                contentContainer.firstElementChild.remove();
              }
            });

          } else if (item.type === 'file') {
            // ファイルの場合（PDFなどのアイコン）
            let icon = "📄";
            if (item.name.toLowerCase().endsWith('.pdf')) icon = "📕";
            if (item.name.toLowerCase().endsWith('.csv') || item.name.toLowerCase().endsWith('.xlsx')) icon = "📊";

            // GitHub Pages上の相対パスをそのままリンクとして利用
            li.innerHTML = `
              <a href="${item.path}" target="_blank" class="flex items-center gap-1 text-amber-700 hover:underline hover:text-amber-900 transition py-0.5">
                <span class="text-lg">${icon}</span> ${item.name}
              </a>
            `;
            ul.appendChild(li);
          }
        }
        
        parentElement.appendChild(ul);
        
      } catch (error) {
        console.error("GitHub APIエラー:", error);
        parentElement.innerHTML = `<p class="text-red-500 text-sm">フォルダの読み込みに失敗しました。</p>`;
      }
    }
  </script>
</body>
</html>
