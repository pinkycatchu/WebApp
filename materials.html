<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修論・参考資料 - 試験体管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">
  
  <!-- 共通ヘッダー（ハンバーガーメニュー付き） -->
  <header class="bg-blue-600 text-white shadow-md relative z-40">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg md:text-xl font-bold">修論・参考資料</h1>
      
      <div class="flex items-center gap-3">
        <a href="index.html" class="hidden sm:block bg-white text-blue-600 font-semibold px-4 py-2 rounded shadow hover:bg-blue-50 transition duration-150">
          HOME
        </a>
        <button onclick="toggleMenu()" class="text-white hover:bg-blue-700 p-2 rounded focus:outline-none transition duration-150">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- モバイル用メニュー -->
    <div id="mobile-menu" class="hidden absolute right-4 top-14 bg-white text-gray-800 rounded shadow-xl border border-gray-200 w-56 overflow-hidden z-50">
      <a href="index.html" class="block px-4 py-3 hover:bg-gray-100 border-b text-sm font-semibold">HOME</a>
      <a href="form.html" class="block px-4 py-3 hover:bg-gray-100 border-b text-sm font-medium">＋ 測定・移動入力</a>
      <a href="calendar.html" class="block px-4 py-3 hover:bg-gray-100 border-b text-sm font-medium">カレンダー</a>
      <a href="materials.html" class="block px-4 py-3 bg-blue-50 border-b text-sm font-bold text-blue-700">資料ページ</a>

      <!-- ログアウトは一番下に配置し、少し赤色にしてわかりやすくしています -->
      <button onclick="logout()" class="w-full text-left block px-4 py-3 hover:bg-red-50 text-red-600 text-sm font-medium">ログアウト</button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-4xl">
    <!-- 共有ドライブ・重要ドキュメント -->
    <section class="mb-8">
      <h2 class="text-xl font-bold text-gray-700 mb-4 border-b-2 border-blue-500 pb-2">リンク集</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- ドライブリンク -->
        <a href="https://drive.google.com/drive/folders/1MVJqZ2kxeXPh2wM7x15LnlSPZzBMnUSn?usp=sharing" target="_blank" class="bg-white p-4 rounded-lg shadow-sm hover:shadow-md border border-gray-200 transition duration-150 flex items-center">
          <div class="bg-blue-100 p-3 rounded-full mr-4">
            <span class="text-xl">📁</span>
          </div>
          <div>
            <h3 class="font-bold text-gray-800">修士論文ドライブ</h3>
          </div>
        </a>

        <!-- ドライブリンク -->
        <a href="https://drive.google.com/file/d/1AbDk-G0p7lG0p0jgdzla-CbK-ttGxINQ/view?usp=sharing" target="_blank" class="bg-white p-4 rounded-lg shadow-sm hover:shadow-md border border-gray-200 transition duration-150 flex items-center">
          <div class="bg-green-100 p-3 rounded-full mr-4">
            <span class="text-xl">📊</span>
          </div>
          <div>
            <h3 class="font-bold text-gray-800">試験計画書</h3>
          </div>
        </a>

      </div>
      <div class="text-sm text-gray-500 mt-2">
        <a href="https://www.forest.go.jp/" target="_blank" class="hover:underline">森林総合研究所HP</a>
      </div>
    </section>

    <!-- 3. 参考文献リスト -->
    <section class="mb-8">
      <h2 class="text-xl font-bold text-gray-700 mb-4 border-b-2 border-blue-500 pb-2">参考文献リスト</h2>
      <div class="bg-white rounded-lg shadow-sm p-4">
        <div class="flex flex-col sm:flex-row sm:items-center gap-3">
          <label class="inline-flex items-center justify-center bg-blue-600 text-white px-4 py-2 rounded cursor-pointer hover:bg-blue-700 transition">
            <span>リストを開く</span>
            <input id="reference-folder-input" type="file" class="hidden" webkitdirectory directory multiple />
          </label>
        </div>

        <div id="reference-tree" class="mt-4 border rounded p-3 bg-gray-50 min-h-[180px] text-sm text-gray-600">
          <p class="text-gray-500">フォルダを選択してください。</p>
        </div>

        <div id="reference-preview" class="mt-4 border rounded overflow-hidden bg-white hidden">
          <div class="flex justify-between items-center px-4 py-2 bg-gray-100 border-b">
            <span id="reference-preview-title" class="font-semibold text-gray-700"></span>
            <button type="button" onclick="closePreview()" class="text-sm text-gray-600 hover:text-gray-900">閉じる</button>
          </div>
          <iframe id="reference-pdf-frame" class="w-full h-[70vh]"></iframe>
        </div>
      </div>
    </section>

  </main>

  <script>
    let selectedPdfUrl = null;

    // メニューの開閉処理
    function toggleMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }

    // メニューの外側をクリックした時に閉じる処理
    document.addEventListener('click', function(event) {
      const menu = document.getElementById('mobile-menu');
      const button = event.target.closest('button[onclick="toggleMenu()"]');
      if (!menu.classList.contains('hidden') && !button && !menu.contains(event.target)) {
        menu.classList.add('hidden');
      }
    });

    // フォルダ選択イベント
    document.getElementById('reference-folder-input').addEventListener('change', handleFolderSelection);

    function handleFolderSelection(event) {
      const files = Array.from(event.target.files || []);
      if (files.length === 0) {
        renderTreeMessage('PDFファイルが見つかりませんでした。');
        return;
      }

      const pdfFiles = files.filter(file => file.type === 'application/pdf' || /\.pdf$/i.test(file.name));
      if (pdfFiles.length === 0) {
        renderTreeMessage('PDFファイルが見つかりませんでした。');
        return;
      }

      const tree = buildFileTree(pdfFiles);
      renderTree(tree);
      closePreview();
    }

    function buildFileTree(files) {
      const root = { name: 'Reference_list', type: 'folder', children: [] };

      files.slice()
        .sort((a, b) => {
          const pathA = a.webkitRelativePath || a.name;
          const pathB = b.webkitRelativePath || b.name;
          return pathA.localeCompare(pathB, 'ja');
        })
        .forEach(file => {
          const relPath = file.webkitRelativePath || file.name;
          const parts = relPath.split('/').filter(Boolean);
          let current = root;

          parts.forEach((part, index) => {
            const isFile = index === parts.length - 1;
            if (isFile) {
              current.children.push({
                name: part,
                type: 'file',
                file
              });
            } else {
              let child = current.children.find(node => node.type === 'folder' && node.name === part);
              if (!child) {
                child = { name: part, type: 'folder', children: [] };
                current.children.push(child);
              }
              current = child;
            }
          });
        });

      return root;
    }

    function renderTree(root) {
      const container = document.getElementById('reference-tree');
      container.innerHTML = '';

      if (!root.children.length) {
        container.innerHTML = '<p class="text-gray-500">PDFファイルが見つかりませんでした。</p>';
        return;
      }

      const ul = document.createElement('ul');
      ul.className = 'space-y-2';
      root.children.forEach(node => appendNode(node, ul));
      container.appendChild(ul);
    }

    function appendNode(node, parentEl) {
      const li = document.createElement('li');

      if (node.type === 'folder') {
        const details = document.createElement('details');
        details.className = 'group';

        const summary = document.createElement('summary');
        summary.className = 'cursor-pointer list-none font-semibold text-gray-700 py-1 select-none';
        summary.innerHTML = `<span class="mr-2">📁</span>${escapeHtml(node.name)}`;

        const ul = document.createElement('ul');
        ul.className = 'ml-5 mt-1 space-y-1';

        node.children.forEach(child => appendNode(child, ul));

        details.appendChild(summary);
        details.appendChild(ul);
        li.appendChild(details);
      } else {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'text-left text-blue-600 hover:underline';
        button.innerHTML = `<span class="mr-2">📄</span>${escapeHtml(node.name)}`;
        button.addEventListener('click', () => previewPdf(node.file));
        li.appendChild(button);
      }

      parentEl.appendChild(li);
    }

    function renderTreeMessage(message) {
      document.getElementById('reference-tree').innerHTML = `<p class="text-gray-500">${escapeHtml(message)}</p>`;
    }

    function previewPdf(file) {
      if (selectedPdfUrl) {
        URL.revokeObjectURL(selectedPdfUrl);
      }

      selectedPdfUrl = URL.createObjectURL(file);

      document.getElementById('reference-preview-title').textContent = file.name;
      document.getElementById('reference-pdf-frame').src = selectedPdfUrl;
      document.getElementById('reference-preview').classList.remove('hidden');
    }

    function closePreview() {
      const frame = document.getElementById('reference-pdf-frame');
      if (selectedPdfUrl) {
        URL.revokeObjectURL(selectedPdfUrl);
        selectedPdfUrl = null;
      }
      frame.src = '';
      document.getElementById('reference-preview').classList.add('hidden');
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (match) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[match]);
    }

    window.addEventListener('beforeunload', () => {
      if (selectedPdfUrl) {
        URL.revokeObjectURL(selectedPdfUrl);
      }
    });
  </script>
</body>
</html>
