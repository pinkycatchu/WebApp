<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測定・移動入力 - 試験体管理</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon-180x180.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen pb-12">
  <script src="header.js"></script>

  <main class="container mx-auto px-4 max-w-lg">
    <!-- 通信エラー時の送信待ちキューの状態表示 -->
    <div id="pending-indicator" class="hidden mb-4 text-xs font-semibold text-[#3398e1] bg-[#c1e1f7]/30 border border-[#3398e1]/30 rounded-[6px] px-3 py-2"></div>

    <div class="bg-white p-6 rounded-[10px] shadow-[0_4px_16px_rgba(0,0,0,0.05)] border border-stone-200">

      <!-- 1. アクション選択 -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-stone-700 mb-2">入力する作業の種類</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btn-action-measure" onclick="setAction('measurement')" class="py-2 px-4 rounded-full font-medium border border-[#3398e1] bg-[#3ba6f1] text-white text-center transition duration-150">
            重量測定
          </button>
          <button type="button" id="btn-action-episode" onclick="setAction('episode')" class="py-2 px-4 rounded-full font-medium border border-stone-300 bg-white text-stone-800 text-center hover:bg-stone-50 transition duration-150">
            試験体移動
          </button>
        </div>
      </div>

      <!-- 2. 試験体ID選択 -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-stone-700 mb-2">試験体IDの入力方法</label>
        <div class="flex gap-4 mb-3">
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" name="input-method" value="barcode" checked onchange="toggleInputMethod()" class="form-radio text-[#3ba6f1]">
            <span class="ml-2 text-sm">QRコード読み取り</span>
          </label>
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" name="input-method" value="select" onchange="toggleInputMethod()" class="form-radio text-[#3ba6f1]">
            <span class="ml-2 text-sm">プルダウンで選択</span>
          </label>
        </div>

        <div id="area-select" class="hidden">
          <select id="specimen-select" class="w-full border border-stone-300 rounded-[6px] p-2.5 focus:outline-none focus:ring-2 focus:ring-[#3ba6f1] focus:border-[#3ba6f1] bg-white">
            <option value="">データを読み込み中...</option>
          </select>
        </div>

        <div id="area-barcode">
          <div id="reader" class="w-full bg-black rounded-[10px] overflow-hidden mb-2"></div>
          <p id="barcode-result" class="text-sm font-bold text-emerald-600 my-1 hidden"></p>
        </div>
      </div>

      <hr class="my-6 border-stone-200">

      <!-- 3. 重量測定用フォーム -->
      <div id="form-measurement">
        <div class="mb-4">
          <label class="block text-sm font-bold text-stone-700 mb-1">重量 (g) <span class="text-red-500">*</span></label>
          <input type="number" id="input-weight" step="0.01" placeholder="例: 1250.50" class="w-full border border-stone-300 rounded-[6px] p-2.5 focus:outline-none focus:ring-2 focus:ring-[#3ba6f1] focus:border-[#3ba6f1]">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold text-stone-700 mb-1">備考・メモ (任意)</label>
          <input type="text" id="input-note-measure" placeholder="状態の変化などがあれば記録" class="w-full border border-stone-300 rounded-[6px] p-2.5 focus:outline-none focus:ring-2 focus:ring-[#3ba6f1] focus:border-[#3ba6f1]">
        </div>
      </div>

      <!-- 4. 試験体移動用フォーム -->
      <div id="form-episode" class="hidden">

        <!-- 移動先（選択肢はheader.jsのLOCATIONSから生成） -->
        <div class="mb-4">
          <label class="block text-sm font-bold text-stone-700 mb-1">新しい移動場所 <span class="text-red-500">*</span></label>
          <select id="input-location" class="w-full border border-stone-300 rounded-[6px] p-2.5 focus:outline-none focus:ring-2 focus:ring-[#3ba6f1] focus:border-[#3ba6f1] bg-white">
            <option value="">-- 移動場所を選択 --</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-bold text-stone-700 mb-1">更新後の状態 <span class="text-red-500">*</span></label>
          <select id="input-condition" class="w-full border border-stone-300 rounded-[6px] p-2.5 focus:outline-none focus:ring-2 focus:ring-[#3ba6f1] focus:border-[#3ba6f1] bg-white">
            <option value="暴露期間中">暴露期間中</option>
            <option value="暴露前">暴露前</option>
            <option value="保管中">保管中</option>
            <option value="暴露終了">暴露終了（回収）</option>
          </select>
        </div>

        <!-- 暴露日数に含めるかどうかの選択 -->
        <div class="mb-4">
          <label class="block text-sm font-bold text-stone-700 mb-1">この移動先の期間を暴露日数に含めますか？ <span class="text-red-500">*</span></label>
          <select id="input-count-exposure" class="w-full border border-stone-300 rounded-[6px] p-2.5 focus:outline-none focus:ring-2 focus:ring-[#3ba6f1] focus:border-[#3ba6f1] bg-white font-semibold text-[#3398e1]">
            <option value="含める">含める（暴露期間としてカウント）</option>
            <option value="含めない">含めない（一時保管・恒温室・回収など）</option>
          </select>
          <p class="text-xs text-stone-500 mt-1">※自動計算バッチ処理がこの設定を読み取り、夜間に残り日数と終了予定日を更新します。</p>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-bold text-stone-700 mb-1">備考・メモ (任意)</label>
          <input type="text" id="input-note-episode" placeholder="移動の理由や作業者名など" class="w-full border border-stone-300 rounded-[6px] p-2.5 focus:outline-none focus:ring-2 focus:ring-[#3ba6f1] focus:border-[#3ba6f1]">
        </div>
      </div>

      <!-- 連続入力モードのチェックボックス -->
      <div class="mb-4 bg-[#c1e1f7]/30 p-3 rounded-[6px] border border-[#3398e1]/30 flex items-center">
        <input type="checkbox" id="continuous-mode" class="w-5 h-5 text-[#3ba6f1] border-stone-300 rounded focus:ring-[#3ba6f1] cursor-pointer" checked>
        <label for="continuous-mode" class="ml-2 font-bold text-[#3398e1] cursor-pointer text-sm">連続で入力する</label>
      </div>

      <button type="button" id="btn-submit" onclick="submitData()" class="w-full bg-[#3ba6f1] border border-[#3398e1] hover:bg-[#3398e1] text-white font-medium py-3 px-4 rounded-full shadow-sm transition duration-150 flex justify-center items-center">
        <span>この内容で登録する</span>
      </button>

    </div>
  </main>

  <script>
    // GASウェブアプリURLはheader.jsのwindow.GAS_API_URL_GLOBALを共通利用
    const GAS_API_URL = window.GAS_API_URL_GLOBAL;

    let currentAction = 'measurement';
    let html5QrCode = null;
    let isCameraRunning = false;
    let scannedSpecimenId = "";

    window.addEventListener('DOMContentLoaded', () => {
      // パスワードがない場合は index.html へ戻してログインさせる
      if (!window.requireLogin()) return;

      window.LOCATIONS.forEach(loc => {
        document.getElementById('input-location').appendChild(new Option(loc, loc));
      });

      loadSpecimenList();
      checkUrlParams();
      toggleInputMethod();

      // オフライン中に送信待ちになったデータがあれば再送信を試みる
      flushPendingQueue();
      updatePendingIndicator();
      window.addEventListener('online', flushPendingQueue);
    });

    // ===== 通信エラー時の送信待ちキュー（localStorageに保存し、オンライン復帰時に自動再送信） =====
    const PENDING_KEY = 'pending_submissions';

    function getPendingQueue() {
      try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { return []; }
    }

    function savePendingQueue(queue) {
      localStorage.setItem(PENDING_KEY, JSON.stringify(queue));
    }

    function queuePendingSubmission(payload) {
      const queue = getPendingQueue();
      queue.push(payload);
      savePendingQueue(queue);
      updatePendingIndicator();
    }

    function updatePendingIndicator() {
      const queue = getPendingQueue();
      const el = document.getElementById('pending-indicator');
      if (queue.length > 0) {
        el.textContent = `⏳ 送信待ちのデータが${queue.length}件あります。オンラインに戻ると自動で再送信します。`;
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    async function flushPendingQueue() {
      const queue = getPendingQueue();
      if (queue.length === 0) return;

      const remaining = [];
      for (const payload of queue) {
        try {
          const response = await fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (result.status !== 'success') remaining.push(payload);
        } catch (e) {
          remaining.push(payload); // まだオフラインの可能性
        }
      }

      savePendingQueue(remaining);
      updatePendingIndicator();
    }

    function checkUrlParams() {

      const params = new URLSearchParams(window.location.search);
      const targetId = params.get('id');
      if (targetId) {
        scannedSpecimenId = targetId;
      }
    }

    async function loadSpecimenList() {
      const select = document.getElementById('specimen-select');
      try {
        // 【変更】パスワードをパラメータに含める
        const res = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(appPassword)}`);
        const json = await res.json();
        
        if (json.status === "success") {
          select.innerHTML = '<option value="">-- 試験体を選択してください --</option>';
          json.data.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.specimen_id;
            opt.textContent = `${item.specimen_id} (${item.material} - ${item.status})`;
            if (item.specimen_id === scannedSpecimenId) {
              opt.selected = true;
            }
            select.appendChild(opt);
          });
        } else if (json.status === "auth_error") {
           // 認証エラー時は localStorage を消去してダッシュボードへ戻す
           localStorage.removeItem('app_password');
           await window.showAlert("認証の有効期限が切れました。再度ログインしてください。");
           window.location.href = "index.html";
        }
      } catch (e) {
        select.innerHTML = '<option value="">データの読み込みに失敗しました</option>';
      }
    }

    function setAction(action) {
      currentAction = action;
      const btnMeasure = document.getElementById('btn-action-measure');
      const btnEpisode = document.getElementById('btn-action-episode');
      const formMeasure = document.getElementById('form-measurement');
      const formEpisode = document.getElementById('form-episode');

      if (action === 'measurement') {
        btnMeasure.className = "py-2 px-4 rounded-full font-medium border border-[#3398e1] bg-[#3ba6f1] text-white text-center transition duration-150";
        btnEpisode.className = "py-2 px-4 rounded-full font-medium border border-stone-300 bg-white text-stone-800 text-center hover:bg-stone-50 transition duration-150";
        formMeasure.classList.remove('hidden');
        formEpisode.classList.add('hidden');
      } else {
        btnEpisode.className = "py-2 px-4 rounded-full font-medium border border-[#3398e1] bg-[#3ba6f1] text-white text-center transition duration-150";
        btnMeasure.className = "py-2 px-4 rounded-full font-medium border border-stone-300 bg-white text-stone-800 text-center hover:bg-stone-50 transition duration-150";
        formEpisode.classList.remove('hidden');
        formMeasure.classList.add('hidden');
      }
    }

    function toggleInputMethod() {
      const method = document.querySelector('input[name="input-method"]:checked').value;
      const areaSelect = document.getElementById('area-select');
      const areaBarcode = document.getElementById('area-barcode');

      if (method === 'select') {
        areaSelect.classList.remove('hidden');
        areaBarcode.classList.add('hidden');
        if (isCameraRunning) stopCamera();
      } else {
        areaSelect.classList.add('hidden');
        areaBarcode.classList.remove('hidden');
        // QRモードが選ばれたら自動的にカメラを起動する
        if (!isCameraRunning) {
          startCamera();
        }
      }
    }

    // ※ toggleCamera関数をstartCamera関数に変更し、ボタン関係の処理を削除
    async function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 150 } },
          (decodedText) => {
            scannedSpecimenId = decodedText.trim();
            const resultEl = document.getElementById('barcode-result');
            resultEl.textContent = `読み取り成功: ${scannedSpecimenId}`;
            resultEl.classList.remove('hidden');
            
            const select = document.getElementById('specimen-select');
            select.value = scannedSpecimenId;
            
            stopCamera();
          }
        );
        isCameraRunning = true;
      } catch (err) {
        window.showAlert("カメラの起動に失敗しました。ブラウザのカメラ許可設定をご確認ください。");
      }
    }

    // ボタンの文字を戻す処理を削除
    async function stopCamera() {
      if (html5QrCode && isCameraRunning) {
        await html5QrCode.stop();
        html5QrCode.clear();
        isCameraRunning = false;
      }
    }
    
    async function submitData() {
      const method = document.querySelector('input[name="input-method"]:checked').value;
      let targetId = "";

      if (method === 'select') {
        targetId = document.getElementById('specimen-select').value;
      } else {
        targetId = scannedSpecimenId;
      }

      if (!targetId) {
        window.showAlert("試験体IDを選択するか、バーコードを読み取ってください。");
        return;
      }

      let payload = {
        action: currentAction,
        specimen_id: targetId,
        password: appPassword // 【追加】送信データにもパスワードを含める
      };

      if (currentAction === 'measurement') {
        const weight = document.getElementById('input-weight').value;
        if (!weight) {
          window.showAlert("重量を入力してください。");
          return;
        }
        payload.weight = weight;
        payload.note = document.getElementById('input-note-measure').value;
      } else {
        const loc = document.getElementById('input-location').value;
        if (!loc) {
          window.showAlert("新しい移動場所を選択してください。");
          return;
        }
        payload.new_location = loc;
        payload.condition = document.getElementById('input-condition').value;
        // 暴露日数に含めるかの値を取得してpayloadに追加
        payload.count_exposure = document.getElementById('input-count-exposure').value;
        payload.note = document.getElementById('input-note-episode').value;
      }

      const btn = document.getElementById('btn-submit');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full mr-2"></span>送信中...`;

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();

        if (result.status === "success") {
          // 連続入力モードがONかどうかを判定
          const isContinuous = document.getElementById('continuous-mode').checked;
          
          if (isContinuous) {
            // ダッシュボードに戻らず、入力欄だけをリセットする
            window.showAlert("✅ 登録が完了しました！\n続けて次の試験体を入力できます。");
            
            scannedSpecimenId = "";
            document.getElementById('specimen-select').value = "";
            document.getElementById('input-weight').value = "";
            document.getElementById('input-location').value = "";
            document.getElementById('input-note-measure').value = "";
            document.getElementById('input-note-episode').value = "";
            document.getElementById('barcode-result').classList.add('hidden');
            
            // 状態が変更された可能性があるのでリストを再読み込み
            loadSpecimenList();

            // 入力方法がQRコードモードのままであれば、カメラを再起動する
            const currentMethod = document.querySelector('input[name="input-method"]:checked').value;
            if (currentMethod === 'barcode') {
              if (!isCameraRunning) {
                startCamera();
              }
            }
            
          } else {
            // 従来通りダッシュボードへ戻る
            await window.showAlert("✅ 登録が完了しました！\n" + result.message);
            window.location.href = "index.html";
          }
        } else if (result.status === "auth_error") {
          localStorage.removeItem('app_password');
          await window.showAlert("認証エラーです。再度ログインしてください。");
          window.location.href = "index.html";
        } else {
          window.showAlert("エラーが発生しました: " + result.message);
        }
      } catch (error) {
        console.error("送信エラー:", error);
        queuePendingSubmission(payload);
        window.showAlert("通信エラーのため送信待ちに登録しました。\nオンラインに戻ると自動で再送信されるので、このまま次の試験体に進んでも大丈夫です。");

        // 連続入力モード同様、入力欄をリセットして次の作業に進めるようにする
        const isContinuous = document.getElementById('continuous-mode').checked;
        if (isContinuous) {
          scannedSpecimenId = "";
          document.getElementById('specimen-select').value = "";
          document.getElementById('input-weight').value = "";
          document.getElementById('input-location').value = "";
          document.getElementById('input-note-measure').value = "";
          document.getElementById('input-note-episode').value = "";
          document.getElementById('barcode-result').classList.add('hidden');
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
