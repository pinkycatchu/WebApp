<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギャラリー - 試験体管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">
  
  <!-- 共通ヘッダー読み込み -->
  <script src="header.js"></script>

  <main class="container mx-auto px-4 max-w-4xl">
    
    <!-- 上部：写真撮影・アップロード機能 -->
    <section class="bg-white p-6 rounded-lg shadow-md mb-8">
      <h2 class="text-xl font-bold text-gray-700 mb-4 border-b-2 border-blue-500 pb-2">写真を撮影する</h2>
      
      <div class="flex flex-col gap-4">
        <!-- ファイル選択 / カメラ起動 -->
        <input type="file" id="photo-input" accept="image/*" capture="environment" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        
        <!-- プレビュー表示 -->
        <div id="preview-container" class="hidden">
          <img id="photo-preview" class="max-w-full h-auto rounded border border-gray-300 max-h-64 object-contain">
          
          <div class="mt-4 flex flex-col sm:flex-row gap-2">
            <input type="text" id="photo-name" placeholder="ファイル名 (例: CLT-01_暴露前)" class="border rounded p-2.5 flex-1 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="btn-upload" onclick="uploadPhoto()" class="bg-blue-600 text-white font-bold py-2.5 px-6 rounded hover:bg-blue-700 flex items-center justify-center gap-2 transition">
              <span>アップロード</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 下部：ギャラリー（一覧表示） -->
    <section>
      <div class="flex justify-between items-center mb-4 border-b-2 border-blue-500 pb-2">
        <h2 class="text-xl font-bold text-gray-700">写真ギャラリー</h2>
        <button onclick="loadGallery()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded transition">🔄 更新</button>
      </div>

      <div id="gallery-loading" class="text-center py-8">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full" role="status"></div>
        <p class="mt-2 text-gray-600 text-sm">写真を読み込み中...</p>
      </div>

      <!-- 写真のグリッド表示 -->
      <div id="photo-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- JSでここに写真が追加されます -->
      </div>

      <!-- さらに読み込むボタン -->
      <div class="text-center mt-6">
        <button id="btn-load-more" onclick="renderNextBatch()" class="hidden bg-gray-700 text-white px-6 py-2 rounded shadow hover:bg-gray-800 transition">
          さらに読み込む (全 <span id="total-photo-count">0</span>枚)
        </button>
      </div>
    </section>

  </main>

  <script>
    // ★ ご自身のGASウェブアプリURLを貼り付けてください ★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwYhNRKqGiB4aZslbkChTbivspwoe7yUk0w8ikYX_dyG7dC2m6kBKrkyTFg6duDy_vAFg/exec";
    
    let compressedBase64 = "";
    
    // ギャラリー用の変数
    let allPhotos = [];
    let currentIndex = 0;
    const BATCH_SIZE = 12; // 1回に表示する写真の枚数

    window.addEventListener('DOMContentLoaded', () => {
      if (!window.appPassword) {
        alert("ログインが必要です。");
        window.location.href = "index.html";
        return;
      }
      
      // 画像が選択されたらプレビューと圧縮を行う
      document.getElementById('photo-input').addEventListener('change', handleFileSelect);
      
      // ギャラリーの読み込み
      loadGallery();
    });

    // 1. 画像のリサイズと圧縮処理（GASへ送るため必須）
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // 最大サイズを1200pxに制限
          const MAX_WIDTH = 1200;
          const MAX_HEIGHT = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height && width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          } else if (height > MAX_HEIGHT) {
            width *= MAX_HEIGHT / height;
            height = MAX_HEIGHT;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 画質を落として軽量化 (0.7 = 70%の画質)
          compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

          // プレビューの表示
          document.getElementById('photo-preview').src = compressedBase64;
          document.getElementById('preview-container').classList.remove('hidden');
          
          // 自動でファイル名の候補を入れる
          const dateStr = new Date().toLocaleDateString('ja-JP').replace(/\//g, '');
          document.getElementById('photo-name').value = `Photo_${dateStr}`;
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    // 2. GASへのアップロード処理
    async function uploadPhoto() {
      const filename = document.getElementById('photo-name').value || "無題の写真";
      if (!compressedBase64) {
        alert("写真が選択されていません。");
        return;
      }

      const btn = document.getElementById('btn-upload');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full mr-2"></span>送信中...`;

      const payload = {
        action: "upload_photo",
        password: window.appPassword,
        filename: filename + ".jpg",
        base64Data: compressedBase64,
        contentType: "image/jpeg"
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === "success") {
          alert("✅ 写真をアップロードしました！");
          // 入力欄のリセット
          document.getElementById('photo-input').value = "";
          document.getElementById('preview-container').classList.add('hidden');
          compressedBase64 = "";
          // ギャラリーを最新化
          loadGallery();
        } else if (result.status === "auth_error") {
          window.logout();
        } else {
          alert("エラー: " + result.message);
        }
      } catch (error) {
        alert("通信エラーが発生しました。");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    // 3. ギャラリーの読み込み処理（GASからファイルリストを取得）
    async function loadGallery() {
      document.getElementById('gallery-loading').classList.remove('hidden');
      document.getElementById('photo-grid').innerHTML = "";
      document.getElementById('btn-load-more').classList.add('hidden');
      currentIndex = 0;

      try {
        const response = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(window.appPassword)}&action=get_photos`);
        const result = await response.json();

        if (result.status === "success") {
          allPhotos = result.data;
          document.getElementById('total-photo-count').textContent = allPhotos.length;
          
          if (allPhotos.length === 0) {
            document.getElementById('photo-grid').innerHTML = `<p class="col-span-full text-center text-gray-400 py-8">写真がまだありません</p>`;
          } else {
            renderNextBatch();
          }
        }
      } catch (error) {
        document.getElementById('photo-grid').innerHTML = `<p class="col-span-full text-center text-red-400 py-8">読み込みに失敗しました</p>`;
      } finally {
        document.getElementById('gallery-loading').classList.add('hidden');
      }
    }

    // 4. 写真を分割して画面に追加する処理
    function renderNextBatch() {
      const grid = document.getElementById('photo-grid');
      const end = Math.min(currentIndex + BATCH_SIZE, allPhotos.length);

      for (let i = currentIndex; i < end; i++) {
        const photo = allPhotos[i];
        const dateObj = new Date(photo.date);
        const dateStr = dateObj.toLocaleDateString('ja-JP') + ' ' + dateObj.getHours() + ':' + String(dateObj.getMinutes()).padStart(2, '0');
        
        // GoogleドライブのIDを使って高速なサムネイル画像(w500)を取得
        const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w500`;

        const div = document.createElement('div');
        div.className = "bg-white p-2 rounded shadow-sm border border-gray-100 flex flex-col";
        div.innerHTML = `
          <a href="https://drive.google.com/file/d/${photo.id}/view" target="_blank" class="block bg-gray-100 rounded overflow-hidden relative pb-[100%] hover:opacity-80 transition">
             <img src="${thumbUrl}" loading="lazy" class="absolute inset-0 w-full h-full object-cover" alt="${photo.name}">
          </a>
          <div class="mt-2 text-xs">
            <p class="font-bold text-gray-700 truncate" title="${photo.name}">${photo.name}</p>
            <p class="text-gray-400">${dateStr}</p>
          </div>
        `;
        grid.appendChild(div);
      }

      currentIndex = end;

      // まだ続きがある場合は「さらに読み込む」ボタンを表示
      const btn = document.getElementById('btn-load-more');
      if (currentIndex < allPhotos.length) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
