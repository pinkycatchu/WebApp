<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギャラリー - 試験体管理</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon-180x180.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen pb-12">

  <!-- 共通ヘッダー読み込み -->
  <script src="header.js"></script>

  <main class="container mx-auto px-4 max-w-4xl">

    <!-- 上部：写真撮影・自動アップロード機能 -->
    <section class="bg-white p-6 rounded-[10px] shadow-[0_4px_16px_rgba(0,0,0,0.05)] border border-stone-200 mb-8 text-center relative overflow-hidden">
      <h2 class="font-display text-xl text-stone-950 mb-4 border-b-2 border-[#3ba6f1] pb-2 text-left">📸 写真を撮影して自動保存</h2>

      <!-- アップロード中のローディング画面 -->
      <div id="upload-overlay" class="hidden absolute inset-0 bg-white/90 flex flex-col justify-center items-center z-10 rounded-[10px]">
        <div class="animate-spin inline-block w-10 h-10 border-4 border-[#3ba6f1] border-t-transparent rounded-full mb-2"></div>
        <p class="text-[#3398e1] font-bold text-sm">クラウドに自動保存中...</p>
      </div>

      <!-- どの試験体の写真かをファイル名に紐付けるための選択欄 -->
      <div class="mb-4 text-left">
        <label class="block text-sm font-bold text-stone-700 mb-1">試験体ID <span class="text-red-500">*</span></label>
        <select id="photo-specimen" class="w-full border border-stone-300 rounded-[6px] p-2.5 focus:outline-none focus:ring-2 focus:ring-[#3ba6f1] focus:border-[#3ba6f1] bg-white">
          <option value="">データを読み込み中...</option>
        </select>
        <p class="text-xs text-stone-500 mt-1">選択した試験体IDがファイル名に自動で付与され、あとから検索・特定しやすくなります。</p>
      </div>

      <!-- カメラ起動ボタン（全体をタップ可能に） -->
      <label class="block w-full cursor-pointer bg-[#c1e1f7]/30 hover:bg-[#c1e1f7]/50 border-2 border-dashed border-[#3ba6f1]/60 rounded-[10px] p-10 transition duration-150">
        <span class="text-5xl mb-3 block">📷</span>
        <span class="text-[#3398e1] font-bold block text-lg">ここをタップして撮影</span>
        <span class="text-xs text-stone-500 mt-2 block">※撮影後すぐに保存されます</span>
        <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden">
      </label>
    </section>

    <!-- 下部：ギャラリー（一覧表示） -->
    <section>
      <div class="flex justify-between items-center mb-4 border-b-2 border-[#3ba6f1] pb-2">
        <h2 class="font-display text-xl text-stone-950">写真ギャラリー</h2>
        <button onclick="loadGallery()" class="text-sm bg-white hover:bg-stone-50 border border-stone-300 text-stone-800 px-3 py-1 rounded-full transition">🔄 更新</button>
      </div>

      <div id="gallery-loading" class="text-center py-8">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-[#3ba6f1] border-t-transparent rounded-full" role="status"></div>
        <p class="mt-2 text-stone-500 text-sm">写真を読み込み中...</p>
      </div>

      <!-- 写真のグリッド表示 -->
      <div id="photo-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- JSでここに写真が追加されます -->
      </div>

      <!-- さらに読み込むボタン -->
      <div class="text-center mt-6">
        <button id="btn-load-more" onclick="renderNextBatch()" class="hidden bg-white border border-stone-300 text-stone-800 px-6 py-2 rounded-full shadow-sm hover:bg-stone-50 transition">
          さらに読み込む (全 <span id="total-photo-count">0</span>枚)
        </button>
      </div>
    </section>

  </main>

  <script>
    // GASウェブアプリURLはheader.jsのwindow.GAS_API_URL_GLOBALを共通利用
    const GAS_API_URL = window.GAS_API_URL_GLOBAL;

    let compressedBase64 = "";

    // ギャラリー用の変数
    let allPhotos = [];
    let currentIndex = 0;
    const BATCH_SIZE = 12; // 1回に表示する写真の枚数

    window.addEventListener('DOMContentLoaded', () => {
      if (!window.requireLogin()) return;

      // 画像が選択されたらプレビューと圧縮を行う
      document.getElementById('photo-input').addEventListener('change', handleFileSelect);

      // ギャラリーの読み込み
      loadGallery();
      loadSpecimenSelect();
    });

    // 試験体IDの選択肢をGASから取得する（写真とIDを紐付けるため）
    async function loadSpecimenSelect() {
      const select = document.getElementById('photo-specimen');
      try {
        const res = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(window.appPassword)}`);
        const json = await res.json();
        if (json.status === "success") {
          select.innerHTML = '<option value="">-- 試験体を選択 --</option>';
          json.data.forEach(item => {
            select.appendChild(new Option(`${item.specimen_id} (${item.material})`, item.specimen_id));
          });
        } else {
          select.innerHTML = '<option value="">読み込みに失敗しました</option>';
        }
      } catch (e) {
        select.innerHTML = '<option value="">読み込みに失敗しました</option>';
      }
    }

    // 1. 画像のリサイズ・圧縮 ＆ そのまま自動アップロード
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const specimenId = document.getElementById('photo-specimen').value;
      if (!specimenId) {
        window.showAlert("先に試験体IDを選択してください。");
        event.target.value = "";
        return;
      }

      // 送信中の画面を表示
      document.getElementById('upload-overlay').classList.remove('hidden');

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const MAX_WIDTH = 1200, MAX_HEIGHT = 1200;
          let width = img.width, height = img.height;

          if (width > height && width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          else if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }

          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 画像を圧縮 (0.7)
          const base64Data = canvas.toDataURL('image/jpeg', 0.7);

          // ファイル名を「試験体ID_撮影時刻」で自動生成 (例: CLT-01_20260730_153045.jpg)
          const d = new Date();
          const dateStr = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + "_" + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
          const filename = `${specimenId}_${dateStr}.jpg`;

          // そのまま送信処理へ
          uploadPhotoAuto(filename, base64Data);
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    // 2. GASへの自動アップロード処理
    async function uploadPhotoAuto(filename, base64Data) {
      const payload = {
        action: "upload_photo",
        password: window.appPassword,
        filename: filename,
        base64Data: base64Data,
        contentType: "image/jpeg"
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === "success") {
          // 保存成功したらギャラリーを自動更新
          loadGallery();
        } else if (result.status === "auth_error") {
          window.logout();
        } else {
          window.showAlert("エラー: " + result.message);
        }
      } catch (error) {
        window.showAlert("通信エラーが発生しました。");
      } finally {
        // 送信中の画面を消し、連続撮影できるようにリセット
        document.getElementById('upload-overlay').classList.add('hidden');
        document.getElementById('photo-input').value = "";
      }
    }
    
    // 3. ギャラリーの読み込み処理（GASからファイルリストを取得）
    async function loadGallery() {
      document.getElementById('gallery-loading').classList.remove('hidden');
      document.getElementById('photo-grid').innerHTML = "";
      document.getElementById('btn-load-more').classList.add('hidden');
      currentIndex = 0;

      try {
        const response = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(window.appPassword)}&action=get_photos`);
        const result = await response.json();

        if (result.status === "success") {
          allPhotos = result.data;
          document.getElementById('total-photo-count').textContent = allPhotos.length;
          
          if (allPhotos.length === 0) {
            document.getElementById('photo-grid').innerHTML = `<p class="col-span-full text-center text-stone-400 py-8">写真がまだありません</p>`;
          } else {
            renderNextBatch();
          }
        }
      } catch (error) {
        document.getElementById('photo-grid').innerHTML = `<p class="col-span-full text-center text-red-400 py-8">読み込みに失敗しました</p>`;
      } finally {
        document.getElementById('gallery-loading').classList.add('hidden');
      }
    }

    // 4. 写真を分割して画面に追加する処理
    function renderNextBatch() {
      const grid = document.getElementById('photo-grid');
      const end = Math.min(currentIndex + BATCH_SIZE, allPhotos.length);

      for (let i = currentIndex; i < end; i++) {
        const photo = allPhotos[i];
        const dateObj = new Date(photo.date);
        const dateStr = dateObj.toLocaleDateString('ja-JP') + ' ' + dateObj.getHours() + ':' + String(dateObj.getMinutes()).padStart(2, '0');
        
        // GoogleドライブのIDを使って高速なサムネイル画像(w500)を取得
        const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w500`;

        // ファイル名の先頭（試験体ID_...形式）から試験体IDを抽出して表示する
        const idPart = photo.name.split('_')[0];
        const specimenBadge = (idPart && idPart !== 'Photo')
          ? `<span class="inline-block text-[10px] font-semibold text-[#3398e1] bg-[#c1e1f7]/40 border border-[#3398e1]/30 rounded-full px-1.5 py-0.5 mb-1">${idPart}</span>`
          : '';

        const div = document.createElement('div');
        div.className = "bg-white p-2 rounded-[10px] shadow-[0_4px_16px_rgba(0,0,0,0.05)] border border-stone-200 flex flex-col";
        div.innerHTML = `
          <a href="https://drive.google.com/file/d/${photo.id}/view" target="_blank" class="block bg-stone-100 rounded-lg overflow-hidden relative pb-[100%] hover:opacity-80 transition">
             <img src="${thumbUrl}" loading="lazy" class="absolute inset-0 w-full h-full object-cover" alt="${photo.name}">
          </a>
          <div class="mt-2 text-xs">
            ${specimenBadge}
            <p class="font-bold text-stone-700 truncate" title="${photo.name}">${photo.name}</p>
            <p class="text-stone-400">${dateStr}</p>
          </div>
        `;
        grid.appendChild(div);
      }

      currentIndex = end;

      // まだ続きがある場合は「さらに読み込む」ボタンを表示
      const btn = document.getElementById('btn-load-more');
      if (currentIndex < allPhotos.length) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
