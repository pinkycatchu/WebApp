  <script>
    // ★ ご自身のGASウェブアプリURLを貼り付けてください ★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwYhNRKqGiB4aZslbkChTbivspwoe7yUk0w8ikYX_dyG7dC2m6kBKrkyTFg6duDy_vAFg/exec";
    
    let compressedBase64 = "";
    
    // ギャラリー用の変数
    let allPhotos = [];
    let currentIndex = 0;
    const BATCH_SIZE = 12; // 1回に表示する写真の枚数

    window.addEventListener('DOMContentLoaded', () => {
      if (!window.appPassword) {
        alert("ログインが必要です。");
        window.location.href = "index.html";
        return;
      }
      
      // 画像が選択されたらプレビューと圧縮を行う
      document.getElementById('photo-input').addEventListener('change', handleFileSelect);
      
      // ギャラリーの読み込み
      loadGallery();
    });

    // 1. 画像のリサイズ・圧縮 ＆ そのまま自動アップロード
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      // 送信中の画面を表示
      document.getElementById('upload-overlay').classList.remove('hidden');

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const MAX_WIDTH = 1200, MAX_HEIGHT = 1200;
          let width = img.width, height = img.height;

          if (width > height && width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } 
          else if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }

          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 画像を圧縮 (0.7)
          const base64Data = canvas.toDataURL('image/jpeg', 0.7);
          
          // ファイル名を撮影時刻から自動生成 (例: Photo_20260730_153045.jpg)
          const d = new Date();
          const dateStr = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + "_" + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
          const filename = `Photo_${dateStr}.jpg`;

          // そのまま送信処理へ
          uploadPhotoAuto(filename, base64Data);
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    // 2. GASへの自動アップロード処理
    async function uploadPhotoAuto(filename, base64Data) {
      const payload = {
        action: "upload_photo",
        password: window.appPassword,
        filename: filename,
        base64Data: base64Data,
        contentType: "image/jpeg"
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === "success") {
          // 保存成功したらギャラリーを自動更新
          loadGallery();
        } else if (result.status === "auth_error") {
          window.logout();
        } else {
          alert("エラー: " + result.message);
        }
      } catch (error) {
        alert("通信エラーが発生しました。");
      } finally {
        // 送信中の画面を消し、連続撮影できるようにリセット
        document.getElementById('upload-overlay').classList.add('hidden');
        document.getElementById('photo-input').value = "";
      }
    }
    
    // 3. ギャラリーの読み込み処理（GASからファイルリストを取得）
    async function loadGallery() {
      document.getElementById('gallery-loading').classList.remove('hidden');
      document.getElementById('photo-grid').innerHTML = "";
      document.getElementById('btn-load-more').classList.add('hidden');
      currentIndex = 0;

      try {
        const response = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(window.appPassword)}&action=get_photos`);
        const result = await response.json();

        if (result.status === "success") {
          allPhotos = result.data;
          document.getElementById('total-photo-count').textContent = allPhotos.length;
          
          if (allPhotos.length === 0) {
            document.getElementById('photo-grid').innerHTML = `<p class="col-span-full text-center text-stone-400 py-8">写真がまだありません</p>`;
          } else {
            renderNextBatch();
          }
        }
      } catch (error) {
        document.getElementById('photo-grid').innerHTML = `<p class="col-span-full text-center text-red-400 py-8">読み込みに失敗しました</p>`;
      } finally {
        document.getElementById('gallery-loading').classList.add('hidden');
      }
    }

    // 4. 写真を分割して画面に追加する処理
    function renderNextBatch() {
      const grid = document.getElementById('photo-grid');
      const end = Math.min(currentIndex + BATCH_SIZE, allPhotos.length);

      for (let i = currentIndex; i < end; i++) {
        const photo = allPhotos[i];
        const dateObj = new Date(photo.date);
        const dateStr = dateObj.toLocaleDateString('ja-JP') + ' ' + dateObj.getHours() + ':' + String(dateObj.getMinutes()).padStart(2, '0');
        
        // GoogleドライブのIDを使って高速なサムネイル画像(w500)を取得
        const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w500`;

        const div = document.createElement('div');
        div.className = "bg-white p-2 rounded-xl shadow-sm border border-stone-200 flex flex-col";
        div.innerHTML = `
          <a href="https://drive.google.com/file/d/${photo.id}/view" target="_blank" class="block bg-stone-100 rounded-lg overflow-hidden relative pb-[100%] hover:opacity-80 transition">
             <img src="${thumbUrl}" loading="lazy" class="absolute inset-0 w-full h-full object-cover" alt="${photo.name}">
          </a>
          <div class="mt-2 text-xs">
            <p class="font-bold text-stone-700 truncate" title="${photo.name}">${photo.name}</p>
            <p class="text-stone-400">${dateStr}</p>
          </div>
        `;
        grid.appendChild(div);
      }

      currentIndex = end;

      // まだ続きがある場合は「さらに読み込む」ボタンを表示
      const btn = document.getElementById('btn-load-more');
      if (currentIndex < allPhotos.length) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }
  </script>
