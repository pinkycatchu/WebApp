<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試験予定カレンダー - 試験体管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendarのライブラリ読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">
  
  <!-- ログイン画面 -->
  <div id="login-overlay" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded shadow-lg max-w-sm w-full mx-4">
      <h2 class="text-xl font-bold mb-4 text-center">システムへのログイン</h2>
      <input type="password" id="login-password" placeholder="パスワードを入力" class="w-full border p-2.5 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded hover:bg-blue-700 transition">ログイン</button>
    </div>
  </div>

  <!-- 共通ヘッダー（ハンバーガーメニュー付き） -->
  <header class="bg-blue-600 text-white shadow-md relative z-40">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg md:text-xl font-bold">試験予定カレンダー</h1>
      
      <div class="flex items-center gap-3">
        <a href="index.html" class="hidden sm:block bg-white text-blue-600 font-semibold px-4 py-2 rounded shadow hover:bg-blue-50 transition duration-150">
          HOME
        </a>
        <button onclick="toggleMenu()" class="text-white hover:bg-blue-700 p-2 rounded focus:outline-none transition duration-150">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- モバイル用メニュー -->
    <div id="mobile-menu" class="hidden absolute right-4 top-14 bg-white text-gray-800 rounded shadow-xl border border-gray-200 w-56 overflow-hidden z-50">
      <a href="index.html" class="block px-4 py-3 hover:bg-gray-100 border-b text-sm font-semibold">HOME</a>
      <a href="form.html" class="block px-4 py-3 hover:bg-gray-100 border-b text-sm font-medium">＋ 測定・移動入力</a>
      <a href="calendar.html" class="block px-4 py-3 bg-blue-50 border-b text-sm font-bold text-blue-700">カレンダー</a>
      <a href="materials.html" class="block px-4 py-3 hover:bg-gray-100 border-b text-sm font-medium">資料ページ</a>

      <!-- ログアウトは一番下に配置し、少し赤色にしてわかりやすくしています -->
      <button onclick="logout()" class="w-full text-left block px-4 py-3 hover:bg-red-50 text-red-600 text-sm font-medium">ログアウト</button>
    </div>
  </header>

  <main class="container mx-auto px-4 max-w-4xl">
    
    <!-- 凡例（色の説明） -->
    <div class="bg-white p-4 rounded-t-lg shadow-sm border-b flex gap-4 text-sm font-bold">
      <div class="flex items-center gap-2">
        <span class="w-4 h-4 bg-blue-500 rounded-sm inline-block"></span>
        <span>重量測定日</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-4 h-4 bg-red-500 rounded-sm inline-block"></span>
        <span>暴露終了予定日</span>
      </div>
    </div>

    <!-- カレンダー本体の表示エリア -->
    <div class="bg-white p-2 md:p-6 rounded-b-lg shadow-md mb-6">
      <div id="loading" class="text-center py-12">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full" role="status"></div>
        <p class="mt-2 text-gray-600">スプレッドシートから予定を取得中...</p>
      </div>
      
      <div id="calendar" class="hidden"></div>
    </div>
  </main>

  <!-- イベント詳細ダイアログ -->
  <div id="event-dialog" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] hidden">
    <div id="event-dialog-panel" class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6">
      <div class="flex justify-between items-start mb-4">
        <h3 id="event-dialog-title" class="text-lg font-bold text-gray-900">詳細</h3>
        <button onclick="closeEventDialog()" class="text-gray-500 hover:text-gray-700 transition" aria-label="閉じる">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div id="event-dialog-body" class="text-sm text-gray-700 whitespace-pre-line leading-6"></div>
      <div class="mt-6 flex justify-end">
        <button onclick="closeEventDialog()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <script>
    // ★ ご自身のGASウェブアプリURLを貼り付けてください ★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwdIw1KRL_7AnmLfBMitZCUZW46QX7klzBhd_fkdbL0_1qUtvo9hfRlM5ntCHknH9v_Zw/exec";

    let appPassword = localStorage.getItem('app_password') || '';
    let calendar; // カレンダーオブジェクト

    window.addEventListener('DOMContentLoaded', () => {
      if (appPassword) {
        document.getElementById('login-overlay').classList.add('hidden');
        fetchDataAndRenderCalendar();
      }
    });

    function login() {
      const input = document.getElementById('login-password').value;
      if (input) {
        localStorage.setItem('app_password', input);
        appPassword = input;
        document.getElementById('login-overlay').classList.add('hidden');
        fetchDataAndRenderCalendar();
      }
    }

    // メニューの開閉処理
    function toggleMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }

    // メニューの外側をクリックした時にメニューを閉じる処理
    document.addEventListener('click', function(event) {
      const menu = document.getElementById('mobile-menu');
      const button = event.target.closest('button[onclick="toggleMenu()"]');
      // メニューが開いており、かつクリックされたのがメニューボタンでもメニュー内でもない場合
      if (!menu.classList.contains('hidden') && !button && !menu.contains(event.target)) {
        menu.classList.add('hidden');
      }
    });

    async function fetchDataAndRenderCalendar() {
      document.getElementById('loading').classList.remove('hidden');
      
      try {
        const response = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(appPassword)}`);
        const result = await response.json();

        if (result.status === "success") {
          // データの取得が成功したらカレンダーを描画
          renderCalendar(result.data);
        } else if (result.status === "auth_error") {
          localStorage.removeItem('app_password');
          alert("パスワードが間違っています。再度ログインしてください。");
          location.reload();
        } else {
          alert("エラー: " + result.message);
        }
      } catch (error) {
        console.error("エラー:", error);
        alert("通信エラーが発生しました。");
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    // カレンダーを描画する関数
    function renderCalendar(data) {
      const calendarEl = document.getElementById('calendar');
      calendarEl.classList.remove('hidden');

      // 予定（イベント）の配列を作成
      const events = [];

      data.forEach(item => {
        // ① 次回測定日の予定を作成 (青色)
        if (item.next_measurements && item.next_measurements !== '-') {
          // YYYY/MM/DD を YYYY-MM-DD に変換
          const dateStr = item.next_measurements.replace(/\//g, '-');
          events.push({
            title: `⚖️ ${item.specimen_id}`,
            start: dateStr,
            allDay: true,
            color: '#3b82f6', // Tailwind blue-500
            extendedProps: {
              type: '測定日',
              material: item.material,
              location: item.current_location,
              status: item.status
            }
          });
        }

        // ② 暴露終了予定日の予定を作成 (赤色)
        if (item.expected_end && item.expected_end !== '-') {
          const endDateStr = item.expected_end.replace(/\//g, '-');
          events.push({
            title: `🏁 ${item.specimen_id}`,
            start: endDateStr,
            allDay: true,
            color: '#ef4444', // Tailwind red-500
            extendedProps: {
              type: '暴露終了',
              material: item.material,
              location: item.current_location,
              status: item.status
            }
          });
        }
      });

      // FullCalendarの初期化と設定
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ja', // 日本語化
        contentHeight: 'auto', // 画面サイズに合わせて高さを自動調整
        events: events,
        
        // カレンダー上の予定をクリックした時の動作
        eventClick: function(info) {
          const props = info.event.extendedProps;
          const msg = `【${props.type}】\n`
                + `試験体ID: ${info.event.title.replace(/⚖️ |🏁 /g, '')}\n`
                + `素材: ${props.material || '-'}\n`
                + `現在地: ${props.location || '-'}\n`
                + `状態: ${props.status || '-'}`;

          showEventDialog('詳細', msg);
        }
      });

      calendar.render();
    }

    function showEventDialog(title, message) {
      document.getElementById('event-dialog-title').textContent = title;
      document.getElementById('event-dialog-body').textContent = message;
      document.getElementById('event-dialog').classList.remove('hidden');
    }

    function closeEventDialog() {
      document.getElementById('event-dialog').classList.add('hidden');
    }

    document.addEventListener('click', function(event) {
      const menu = document.getElementById('mobile-menu');
      const button = event.target.closest('button[onclick="toggleMenu()"]');

      if (!menu.classList.contains('hidden') && !button && !menu.contains(event.target)) {
        menu.classList.add('hidden');
      }

      const dialog = document.getElementById('event-dialog');
      if (!dialog.classList.contains('hidden') && event.target === dialog) {
        closeEventDialog();
      }
    });
  </script>
</body>
</html>
