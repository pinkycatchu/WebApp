<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試験体管理システム</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon-180x180.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
  <script src="header.js"></script>

  <main class="container mx-auto px-4 py-6">

    <!-- ようこそ・概要セクション -->
    <div class="mb-6">
      <p class="text-[11px] tracking-[0.25em] text-amber-700 font-semibold mb-1">SPECIMEN TRACKING SYSTEM</p>
      <h2 class="text-2xl md:text-3xl font-bold text-stone-900 mb-1">試験体一覧ダッシュボード</h2>
      <p class="text-stone-500 text-sm">屋外暴露試験・促進耐候性試験の進捗をひと目で確認できます。</p>
    </div>

    <!-- 概要統計カード -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl border border-stone-200 shadow-sm p-4">
        <p class="text-xs text-stone-500 mb-1">総試験体数</p>
        <p id="stat-total" class="text-3xl font-bold text-stone-900">–</p>
      </div>
      <div class="bg-white rounded-xl border border-stone-200 shadow-sm p-4">
        <p class="text-xs text-stone-500 mb-1">暴露期間中</p>
        <p id="stat-active" class="text-3xl font-bold text-emerald-700">–</p>
      </div>
      <div class="bg-white rounded-xl border border-stone-200 shadow-sm p-4">
        <p class="text-xs text-stone-500 mb-1">暴露終了</p>
        <p id="stat-done" class="text-3xl font-bold text-slate-700">–</p>
      </div>
      <div class="bg-white rounded-xl border border-stone-200 shadow-sm p-4">
        <p class="text-xs text-stone-500 mb-1">要確認</p>
        <p id="stat-alert" class="text-3xl font-bold text-red-600">–</p>
      </div>
    </div>

    <div id="alert-container" class="mb-6 hidden"></div>

    <!-- 高機能コントロールバー（検索・各種フィルタ・更新） -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 mb-6 flex flex-col lg:flex-row gap-4 justify-between items-start lg:items-center">
      <div class="flex gap-3 flex-wrap items-center w-full">

        <!-- 1. 試験体ID検索 -->
        <input type="text" id="search-input" placeholder="ID検索..." class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 w-full sm:w-auto">

        <!-- 2. 素材検索 -->
        <select id="material-filter" class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 w-full sm:w-auto bg-white">
          <option value="">-- すべての素材 --</option>
          <option value="CLT">CLT</option>
          <option value="集成材">集成材</option>
        </select>

        <!-- 3. 状態フィルター -->
        <select id="condition-filter" class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 w-full sm:w-auto bg-white">
          <option value="">-- すべての状態 --</option>
          <option value="暴露前">暴露前</option>
          <option value="暴露期間中">暴露期間中</option>
          <option value="暴露終了">暴露終了</option>
        </select>

        <!-- 4. 現在地フィルター（選択肢はheader.jsのLOCATIONSから生成） -->
        <select id="location-filter" class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 w-full sm:w-auto bg-white">
          <option value="">-- すべての場所 --</option>
        </select>

        <!-- 5. 暴露日数フィルター（範囲） -->
        <div class="flex items-center gap-1 bg-stone-50 border border-stone-300 rounded-lg px-2 py-1 w-full sm:w-auto">
          <span class="text-sm text-stone-600 font-medium whitespace-nowrap">暴露日数:</span>
          <input type="number" id="days-min" placeholder="Min" class="w-16 border border-stone-300 rounded-md px-1.5 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 bg-white">
          <span class="text-stone-500 text-sm">〜</span>
          <input type="number" id="days-max" placeholder="Max" class="w-16 border border-stone-300 rounded-md px-1.5 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 bg-white">
          <span class="text-stone-500 text-sm">日</span>
        </div>
      </div>

      <!-- CSV出力ボタンと更新ボタン -->
      <div class="flex gap-2 w-full lg:w-auto mt-2 lg:mt-0 justify-end">
        <button onclick="exportCSV()" class="bg-white text-stone-700 border border-stone-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-stone-50 flex items-center gap-1 shadow-sm whitespace-nowrap transition">
          <span>CSV出力</span>
        </button>
        <button onclick="fetchData()" class="bg-slate-800 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 flex items-center gap-1 shadow-sm whitespace-nowrap transition">
          <span>データを更新</span>
        </button>
      </div>
    </div>

    <div id="loading" class="text-center py-12 hidden">
      <div class="animate-spin inline-block w-8 h-8 border-4 border-amber-600 border-t-transparent rounded-full" role="status"></div>
      <p class="mt-2 text-stone-500">データを取得中...</p>
    </div>

    <!-- 選択中の試験体をまとめて移動するバー（1件以上選択で表示） -->
    <div id="bulk-action-bar" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4 flex flex-col lg:flex-row gap-3 items-start lg:items-center justify-between">
      <p class="text-sm font-semibold text-amber-800"><span id="bulk-count">0</span>件を選択中</p>
      <div class="flex flex-wrap gap-2 items-center">
        <select id="bulk-location" class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm bg-white">
          <option value="">-- 移動先を選択 --</option>
        </select>
        <select id="bulk-condition" class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm bg-white">
          <option value="暴露期間中">暴露期間中</option>
          <option value="暴露前">暴露前</option>
          <option value="保管中">保管中</option>
          <option value="暴露終了">暴露終了（回収）</option>
        </select>
        <select id="bulk-count-exposure" class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm bg-white font-semibold text-amber-700">
          <option value="含める">含める（暴露期間としてカウント）</option>
          <option value="含めない">含めない（一時保管・恒温室・回収など）</option>
        </select>
        <button onclick="executeBulkMove()" id="btn-bulk-move" class="bg-amber-700 hover:bg-amber-800 text-white text-sm font-semibold px-4 py-1.5 rounded-lg shadow-sm transition">一括移動を実行</button>
        <button onclick="clearSelection()" class="text-sm text-stone-500 hover:text-stone-700 px-2 transition">選択解除</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-x-auto hidden" id="table-container">
      <table class="min-w-full text-left text-sm whitespace-nowrap">
        <thead class="bg-stone-50 border-b border-stone-200 font-semibold text-stone-500 uppercase tracking-wide text-xs">
          <tr>
            <th class="py-3 px-4"><input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this)"></th>
            <th class="py-3 px-4">試験体ID</th>
            <th class="py-3 px-4">操作</th>
            <th class="py-3 px-4">素材</th>
            <th class="py-3 px-4">状態</th>

            <th class="py-3 px-4">現在地</th>
            <th class="py-3 px-4">暴露日数 (経過/計画)</th>
            <th class="py-3 px-4">次回測定日</th>
            <th class="py-3 px-4">終了予定日</th>
          </tr>
        </thead>
        <tbody id="specimen-list" class="divide-y divide-stone-100"></tbody>
      </table>
    </div>
  </main>

  <!-- 重量測定履歴グラフのモーダル -->
  <div id="history-dialog" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-[60] hidden p-4">
    <div class="bg-white rounded-xl shadow-2xl border border-stone-200 max-w-2xl w-full p-6 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start mb-4">
        <h3 id="history-dialog-title" class="text-lg font-bold text-stone-900">重量測定履歴</h3>
        <button onclick="closeHistoryDialog()" class="text-stone-400 hover:text-stone-600 transition" aria-label="閉じる">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div id="history-loading" class="text-center py-8">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-amber-600 border-t-transparent rounded-full"></div>
      </div>
      <div id="history-content" class="hidden">
        <canvas id="history-chart" height="200"></canvas>
        <div class="mt-4 overflow-x-auto">
          <table class="min-w-full text-left text-xs whitespace-nowrap">
            <thead class="text-stone-500 border-b border-stone-200">
              <tr><th class="py-2 pr-4">測定日時</th><th class="py-2 pr-4">重量(g)</th><th class="py-2">備考</th></tr>
            </thead>
            <tbody id="history-table-body" class="divide-y divide-stone-100"></tbody>
          </table>
        </div>
      </div>
      <p id="history-empty" class="hidden text-center text-stone-400 py-8">測定履歴がまだありません</p>
    </div>
  </div>

  <script>
    // GASウェブアプリURLはheader.jsのwindow.GAS_API_URL_GLOBALを共通利用
    const GAS_API_URL = window.GAS_API_URL_GLOBAL;

    let allSpecimens = [];
    let currentFilteredSpecimens = [];

    window.addEventListener('DOMContentLoaded', () => {
      populateLocationOptions();

      if (window.appPassword) {
        fetchData();
      }

      // フィルター入力欄の値が変わった時に、表を再描画するイベント設定
      document.getElementById('search-input').addEventListener('input', renderTable);
      document.getElementById('condition-filter').addEventListener('change', renderTable);
      document.getElementById('material-filter').addEventListener('input', renderTable);
      document.getElementById('location-filter').addEventListener('change', renderTable);
      document.getElementById('days-min').addEventListener('input', renderTable);
      document.getElementById('days-max').addEventListener('input', renderTable);
    });

    // 現在地フィルター／一括移動バーの選択肢を、共通のLOCATIONS一覧から生成する
    function populateLocationOptions() {
      const filterSelect = document.getElementById('location-filter');
      const bulkSelect = document.getElementById('bulk-location');
      window.LOCATIONS.forEach(loc => {
        filterSelect.appendChild(new Option(loc, loc));
        bulkSelect.appendChild(new Option(loc, loc));
      });
    }

    async function fetchData() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('table-container').classList.add('hidden');
      document.getElementById('alert-container').classList.add('hidden');

      try {
        const response = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(appPassword)}`);
        const result = await response.json();

        if (result.status === "success") {
          allSpecimens = result.data;
          allMeasurements = null; // 履歴グラフのキャッシュも更新時にクリア
          renderTable();
          updateStats();
          checkAlerts();
        } else if (result.status === "auth_error") {
          alert("パスワードが間違っています。再度ログインしてください。");
          logout();
        } else {
          alert("エラー: " + result.message);
        }
      } catch (error) {
        console.error("エラー:", error);
        alert("通信エラーが発生しました。");
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('table-container').classList.remove('hidden');
      }
    }

    function renderTable() {
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      const conditionVal = document.getElementById('condition-filter').value;
      const materialVal = document.getElementById('material-filter').value.toLowerCase();
      const locationVal = document.getElementById('location-filter').value;
      const daysMinVal = parseInt(document.getElementById('days-min').value, 10);
      const daysMaxVal = parseInt(document.getElementById('days-max').value, 10);
      
      const tbody = document.getElementById('specimen-list');
      tbody.innerHTML = '';

      const filtered = allSpecimens.filter(item => {
        const matchId = (item.specimen_id || '').toLowerCase().includes(searchVal);
        const matchMaterial = (item.material || '').toLowerCase().includes(materialVal);
        const matchCondition = conditionVal === '' || item.status === conditionVal;
        const matchLocation = locationVal === '' || item.current_location === locationVal;

        const effective = Number(item.effective_days) || 0;
        let matchDaysMin = true;
        let matchDaysMax = true;
        if (!isNaN(daysMinVal)) matchDaysMin = effective >= daysMinVal;
        if (!isNaN(daysMaxVal)) matchDaysMax = effective <= daysMaxVal;

        return matchId && matchMaterial && matchCondition && matchLocation && matchDaysMin && matchDaysMax;
      });

      currentFilteredSpecimens = filtered;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-stone-400">該当するデータがありません</td></tr>`;
        updateBulkBar();
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-amber-50/40 transition duration-150";

        let badgeStyle = "bg-stone-100 text-stone-600";
        // バッジの判定を status に戻しました
        if (item.status === "暴露期間中") badgeStyle = "bg-emerald-100 text-emerald-800 font-semibold";
        if (item.status === "暴露終了") badgeStyle = "bg-slate-100 text-slate-700";

        const effective = Number(item.effective_days) || 0;
        const planned = Number(item.planned_days) || 0;
        const isOver = planned > 0 && effective >= planned;
        const daysColor = isOver ? "text-red-600 font-bold" : "text-stone-700";
        const nextMeasureFormatted = formatDateToYMD(item.next_measurements);
        const expectedEndFormatted = formatDateToYMD(item.expected_end);

        tr.innerHTML = `
          <td class="py-3 px-4"><input type="checkbox" class="specimen-checkbox" value="${item.specimen_id || ''}" onchange="updateBulkBar()"></td>
          <td class="py-3 px-4 font-semibold text-amber-800">${item.specimen_id || '-'}</td>
          <td class="py-3 px-4">
            <div class="flex gap-1">
              <a href="form.html?id=${encodeURIComponent(item.specimen_id || '')}" class="text-amber-700 hover:text-amber-900 text-xs font-medium bg-amber-50 px-2 py-1 rounded-md border border-amber-200 transition">
                記録する
              </a>
              <button onclick="showHistory('${item.specimen_id || ''}')" class="text-slate-700 hover:text-slate-900 text-xs font-medium bg-slate-50 px-2 py-1 rounded-md border border-slate-200 transition">
                📈 履歴
              </button>
            </div>
          </td>
          <td class="py-3 px-4">${item.material || '-'}</td>
          <td class="py-3 px-4"><span class="px-2 py-1 rounded-full text-xs ${badgeStyle}">${item.status || '-'}</span></td>
          <td class="py-3 px-4">${item.current_location || '-'}</td>
          <td class="py-3 px-4 ${daysColor}">${effective} 日 / ${planned} 日</td>
          <td class="py-3 px-4">${nextMeasureFormatted}</td>
          <td class="py-3 px-4">${expectedEndFormatted}</td>
        `;
        tbody.appendChild(tr);
      });

      updateBulkBar();
    }

    // ===== 重量測定履歴グラフ =====
    let allMeasurements = null; // 初回表示時に取得してキャッシュ
    let historyChart = null;

    async function showHistory(specimenId) {
      document.getElementById('history-dialog-title').textContent = `重量測定履歴: ${specimenId}`;
      document.getElementById('history-dialog').classList.remove('hidden');
      document.getElementById('history-loading').classList.remove('hidden');
      document.getElementById('history-content').classList.add('hidden');
      document.getElementById('history-empty').classList.add('hidden');

      if (allMeasurements === null) {
        try {
          const res = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(appPassword)}&action=get_measurements`);
          const json = await res.json();
          allMeasurements = (json.status === "success") ? json.data : [];
        } catch (e) {
          allMeasurements = [];
        }
      }

      document.getElementById('history-loading').classList.add('hidden');

      const rows = allMeasurements
        .filter(m => m.specimen_id === specimenId)
        .sort((a, b) => new Date(a['測定日時']) - new Date(b['測定日時']));

      if (rows.length === 0) {
        document.getElementById('history-empty').classList.remove('hidden');
        return;
      }

      document.getElementById('history-content').classList.remove('hidden');
      renderHistoryChart(rows);
      renderHistoryTable(rows);
    }

    function renderHistoryChart(rows) {
      const ctx = document.getElementById('history-chart').getContext('2d');
      if (historyChart) historyChart.destroy();
      historyChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: rows.map(r => r['測定日時']),
          datasets: [{
            label: '重量 (g)',
            data: rows.map(r => Number(r['重量(g)'])),
            borderColor: '#92672f',
            backgroundColor: 'rgba(146, 103, 47, 0.1)',
            tension: 0.2,
            pointBackgroundColor: '#92672f',
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { title: { display: true, text: '重量 (g)' } }
          }
        }
      });
    }

    function renderHistoryTable(rows) {
      const tbody = document.getElementById('history-table-body');
      tbody.innerHTML = rows.slice().reverse().map(r => `
        <tr>
          <td class="py-2 pr-4">${r['測定日時'] || '-'}</td>
          <td class="py-2 pr-4">${r['重量(g)'] || '-'}</td>
          <td class="py-2 text-stone-500">${r['備考'] || ''}</td>
        </tr>
      `).join('');
    }

    function closeHistoryDialog() {
      document.getElementById('history-dialog').classList.add('hidden');
    }

    document.addEventListener('click', function(event) {
      const dialog = document.getElementById('history-dialog');
      if (!dialog.classList.contains('hidden') && event.target === dialog) {
        closeHistoryDialog();
      }
    });

    // ===== 一括移動機能 =====
    function toggleSelectAll(checkbox) {
      document.querySelectorAll('.specimen-checkbox').forEach(cb => cb.checked = checkbox.checked);
      updateBulkBar();
    }

    function getSelectedIds() {
      return Array.from(document.querySelectorAll('.specimen-checkbox:checked')).map(cb => cb.value);
    }

    function updateBulkBar() {
      const ids = getSelectedIds();
      document.getElementById('bulk-count').textContent = ids.length;
      document.getElementById('bulk-action-bar').classList.toggle('hidden', ids.length === 0);

      const allBoxes = document.querySelectorAll('.specimen-checkbox');
      const selectAll = document.getElementById('select-all-checkbox');
      selectAll.checked = allBoxes.length > 0 && ids.length === allBoxes.length;
    }

    function clearSelection() {
      document.querySelectorAll('.specimen-checkbox').forEach(cb => cb.checked = false);
      updateBulkBar();
    }

    async function executeBulkMove() {
      const ids = getSelectedIds();
      if (ids.length === 0) return;

      const location = document.getElementById('bulk-location').value;
      const condition = document.getElementById('bulk-condition').value;
      const countExposure = document.getElementById('bulk-count-exposure').value;

      if (!location) {
        alert("移動先を選択してください。");
        return;
      }
      if (!confirm(`${ids.length}件の試験体を「${location}」へ一括移動します。よろしいですか？`)) return;

      const btn = document.getElementById('btn-bulk-move');
      const originalText = btn.textContent;
      btn.disabled = true;

      let successCount = 0;
      let failCount = 0;

      for (let i = 0; i < ids.length; i++) {
        btn.textContent = `送信中... (${i + 1}/${ids.length})`;
        try {
          const response = await fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'episode',
              specimen_id: ids[i],
              new_location: location,
              condition: condition,
              count_exposure: countExposure,
              note: '一括移動',
              password: appPassword
            })
          });
          const result = await response.json();
          if (result.status === 'success') {
            successCount++;
          } else {
            failCount++;
          }
        } catch (e) {
          failCount++;
        }
      }

      btn.disabled = false;
      btn.textContent = originalText;

      alert(`一括移動が完了しました。成功: ${successCount}件 / 失敗: ${failCount}件`);
      clearSelection();
      fetchData();
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = allSpecimens.length;
      document.getElementById('stat-active').textContent = allSpecimens.filter(item => item.status === "暴露期間中").length;
      document.getElementById('stat-done').textContent = allSpecimens.filter(item => item.status === "暴露終了").length;
    }

    function exportCSV() {
      if (currentFilteredSpecimens.length === 0) {
        alert("出力するデータがありません。");
        return;
      }
      
      // 1行目の見出し
      const headers = ["試験体ID", "素材", "状態", "現在地", "暴露日数", "計画日数", "次回測定日", "終了予定日"];
      const csvRows = [headers.join(",")];
      
      // データ行の作成
      currentFilteredSpecimens.forEach(item => {
        const row = [
          item.specimen_id || '',
          item.material || '',
          item.status || '',
          item.current_location || '',
          item.effective_days || 0,
          item.planned_days || 0,
          formatDateToYMD(item.next_measurements),
          formatDateToYMD(item.expected_end)
        ];
        
        // カンマや改行が含まれても壊れないようにダブルクォーテーションで囲む
        const escapedRow = row.map(v => `"${String(v).replace(/"/g, '""')}"`);
        csvRows.push(escapedRow.join(","));
      });
      
      const csvString = csvRows.join("\n");
      
      // Excelで文字化けしないようにBOM(Byte Order Mark)を付与
      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, csvString], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      // ダウンロードの実行
      const a = document.createElement("a");
      a.href = url;
      const dateStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '');
      a.download = `試験体データ_${dateStr}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function checkAlerts() {
      const alertContainer = document.getElementById('alert-container');
      const todayStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '/');
      let alerts = [];

      allSpecimens.forEach(item => {
        const effective = Number(item.effective_days) || 0;
        const planned = Number(item.planned_days) || 0;
        
        // 警告の判定を status に戻しました
        if (planned > 0 && effective >= planned && (item.status === "屋外暴露" || item.status === "促進耐候性試験" || item.status === "暴露期間中")) {
          alerts.push(`【目標日数到達】試験体 <b>${item.specimen_id}</b> が計画日数（${planned}日）に到達・超過しています。`);
        }
        
        const nextDate = formatDateToYMD(item.next_measurements);
        if (nextDate && nextDate === todayStr) {
          alerts.push(`【測定日当日】試験体 <b>${item.specimen_id}</b> の重量測定日です。`);
        }
      });

      document.getElementById('stat-alert').textContent = alerts.length;

      if (alerts.length > 0) {
        alertContainer.innerHTML = `
          <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl shadow-sm">
            <div class="flex items-center mb-1"><span class="text-red-500 text-lg mr-2">⚠️</span><h3 class="text-red-800 font-bold">システム通知</h3></div>
            <ul class="list-disc list-inside text-sm text-red-700 space-y-1 ml-6">${alerts.map(a => `<li>${a}</li>`).join('')}</ul>
          </div>
        `;
        alertContainer.classList.remove('hidden');
      }
    }
  </script>
</body>
