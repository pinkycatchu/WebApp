<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試験体管理システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">
  
  <!-- ログイン画面 -->
  <div id="login-overlay" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded shadow-lg max-w-sm w-full mx-4">
      <h2 class="text-xl font-bold mb-4 text-center">システムへのログイン</h2>
      <input type="password" id="login-password" placeholder="パスワードを入力" class="w-full border p-2.5 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded hover:bg-blue-700 transition">ログイン</button>
    </div>
  </div>

  <header class="bg-blue-600 text-white shadow-md">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg md:text-xl font-bold">暴露試験体管理</h1>
      <div class="flex gap-2">
        <button onclick="logout()" class="text-white text-sm hover:underline px-2">ログアウト</button>
        <a href="form.html" class="bg-white text-blue-600 font-semibold px-4 py-2 rounded shadow hover:bg-blue-50 transition duration-150">＋ 入力へ</a>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6">
    <div id="alert-container" class="mb-6 hidden"></div>

    <!-- 高機能コントロールバー（検索・各種フィルタ・更新） -->
    <div class="bg-white p-4 rounded shadow mb-6 flex flex-col lg:flex-row gap-4 justify-between items-start lg:items-center">
      <div class="flex gap-3 flex-wrap items-center w-full">
        
        <!-- 1. 試験体ID検索 -->
        <input type="text" id="search-input" placeholder="ID検索..." class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-auto">
        
        <!-- 2. 素材検索 -->
        <input type="text" id="material-filter" placeholder="素材検索 (例: CLT)..." class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-auto">
        <select id="material-filter" class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-auto bg-white">
          <option value="">-- すべての素材 --</option>
          <option value="CLT">CLT</option>
          <option value="集成材">集成材</option>
        </select>
        
        <!-- 3. 状態フィルター -->
        <select id="condition-filter" class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-auto bg-white">
          <option value="">-- すべての状態 --</option>
          <option value="暴露前">暴露前</option>
          <option value="暴露期間中">暴露期間中</option>
          <option value="暴露終了">暴露終了</option>
        </select>

        <!-- 4. 現在地フィルター -->
        <select id="location-filter" class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-auto bg-white">
          <option value="">-- すべての場所 --</option>
          <option value="回収">回収</option>
          <option value="I-ref棟恒温室">I-ref棟恒温室</option>
          <option value="5号館恒温室">5号館恒温室</option>
          <option value="7号館恒温恒湿室">7号館恒温恒湿室</option>
          <option value="5号館屋上">5号館屋上</option>
          <option value="森林総合研究所">森林総合研究所</option>
        </select>

        <!-- 5. 暴露日数フィルター（範囲） -->
        <div class="flex items-center gap-1 bg-gray-50 border rounded px-2 py-1 w-full sm:w-auto">
          <span class="text-sm text-gray-600 font-medium whitespace-nowrap">暴露日数:</span>
          <input type="number" id="days-min" placeholder="Min" class="w-16 border rounded px-1.5 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          <span class="text-gray-500 text-sm">〜</span>
          <input type="number" id="days-max" placeholder="Max" class="w-16 border rounded px-1.5 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          <span class="text-gray-500 text-sm">日</span>
        </div>
      </div>
      
      <!-- 更新ボタン -->
      <button onclick="fetchData()" class="bg-gray-700 text-white px-5 py-2 rounded text-sm hover:bg-gray-800 flex items-center gap-1 shadow whitespace-nowrap">
        <span>データを更新</span>
      </button>
    </div>

    <div id="loading" class="text-center py-12 hidden">
      <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full" role="status"></div>
      <p class="mt-2 text-gray-600">データを取得中...</p>
    </div>

    <div class="bg-white rounded shadow overflow-x-auto hidden" id="table-container">
      <table class="min-w-full text-left text-sm whitespace-nowrap">
        <thead class="bg-gray-50 border-b font-semibold text-gray-600">
          <tr>
            <th class="py-3 px-4">試験体ID</th>
            <th class="py-3 px-4">素材</th>
            <th class="py-3 px-4">状態</th>
            <th class="py-3 px-4">現在地</th>
            <th class="py-3 px-4">暴露日数 (経過/計画)</th>
            <th class="py-3 px-4">次回測定日</th>
            <th class="py-3 px-4">終了予定日</th>
            <th class="py-3 px-4">操作</th>
          </tr>
        </thead>
        <tbody id="specimen-list" class="divide-y divide-gray-200"></tbody>
      </table>
    </div>
  </main>

  <script>
    // ★ ご自身のGASウェブアプリURLを貼り付けてください ★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwdIw1KRL_7AnmLfBMitZCUZW46QX7klzBhd_fkdbL0_1qUtvo9hfRlM5ntCHknH9v_Zw/exec";

    let allSpecimens = [];
    let appPassword = localStorage.getItem('app_password') || '';

    window.addEventListener('DOMContentLoaded', () => {
      if (appPassword) {
        document.getElementById('login-overlay').classList.add('hidden');
        fetchData();
      }
      
      // フィルター入力欄の値が変わった時に、表を再描画するイベント設定
      document.getElementById('search-input').addEventListener('input', renderTable);
      document.getElementById('condition-filter').addEventListener('change', renderTable);
      document.getElementById('material-filter').addEventListener('input', renderTable);
      document.getElementById('location-filter').addEventListener('change', renderTable);
      document.getElementById('days-min').addEventListener('input', renderTable);
      document.getElementById('days-max').addEventListener('input', renderTable);
    });

    function login() {
      const input = document.getElementById('login-password').value;
      if (input) {
        localStorage.setItem('app_password', input);
        appPassword = input;
        document.getElementById('login-overlay').classList.add('hidden');
        fetchData();
      }
    }

    function logout() {
      localStorage.removeItem('app_password');
      location.reload();
    }

    function formatDateToYMD(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}/${m}/${day}`;
    }

    async function fetchData() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('table-container').classList.add('hidden');
      document.getElementById('alert-container').classList.add('hidden');

      try {
        const response = await fetch(`${GAS_API_URL}?password=${encodeURIComponent(appPassword)}`);
        const result = await response.json();

        if (result.status === "success") {
          allSpecimens = result.data;
          renderTable();
          checkAlerts();
        } else if (result.status === "auth_error") {
          alert("パスワードが間違っています。再度ログインしてください。");
          logout();
        } else {
          alert("エラー: " + result.message);
        }
      } catch (error) {
        console.error("エラー:", error);
        alert("通信エラーが発生しました。");
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('table-container').classList.remove('hidden');
      }
    }

    function renderTable() {
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      const conditionVal = document.getElementById('condition-filter').value;
      const materialVal = document.getElementById('material-filter').value.toLowerCase();
      const locationVal = document.getElementById('location-filter').value;
      const daysMinVal = parseInt(document.getElementById('days-min').value, 10);
      const daysMaxVal = parseInt(document.getElementById('days-max').value, 10);
      
      const tbody = document.getElementById('specimen-list');
      tbody.innerHTML = '';

      const filtered = allSpecimens.filter(item => {
        const matchId = (item.specimen_id || '').toLowerCase().includes(searchVal);
        const matchMaterial = (item.material || '').toLowerCase().includes(materialVal);
        const matchCondition = conditionVal === '' || item.status === conditionVal;
        const matchLocation = locationVal === '' || item.current_location === locationVal;

        const effective = Number(item.effective_days) || 0;
        let matchDaysMin = true;
        let matchDaysMax = true;
        if (!isNaN(daysMinVal)) matchDaysMin = effective >= daysMinVal;
        if (!isNaN(daysMaxVal)) matchDaysMax = effective <= daysMaxVal;

        return matchId && matchMaterial && matchCondition && matchLocation && matchDaysMin && matchDaysMax;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-gray-400">該当するデータがありません</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 transition duration-150";

        let badgeStyle = "bg-gray-200 text-gray-700";
        // バッジの判定を status に戻しました
        if (item.status === "暴露期間中") badgeStyle = "bg-green-100 text-green-800 font-semibold";
        if (item.status === "暴露終了") badgeStyle = "bg-blue-100 text-blue-800";

        const effective = Number(item.effective_days) || 0;
        const planned = Number(item.planned_days) || 0;
        const isOver = planned > 0 && effective >= planned;
        const daysColor = isOver ? "text-red-600 font-bold" : "text-gray-700";
        const nextMeasureFormatted = formatDateToYMD(item.next_measurements);
        const expectedEndFormatted = formatDateToYMD(item.expected_end);

        tr.innerHTML = `
          <td class="py-3 px-4 font-medium text-blue-600">${item.specimen_id || '-'}</td>
          <td class="py-3 px-4">${item.material || '-'}</td>
          <td class="py-3 px-4"><span class="px-2 py-1 rounded text-xs ${badgeStyle}">${item.status || '-'}</span></td>
          <td class="py-3 px-4">${item.current_location || '-'}</td>
          <td class="py-3 px-4 ${daysColor}">${effective} 日 / ${planned} 日</td>
          <td class="py-3 px-4">${nextMeasureFormatted}</td>
          <td class="py-3 px-4">${expectedEndFormatted}</td>
          <td class="py-3 px-4">
            <a href="form.html?id=${encodeURIComponent(item.specimen_id || '')}" class="text-indigo-600 hover:text-indigo-900 text-xs bg-indigo-50 px-2 py-1 rounded border border-indigo-200">
              記録する
            </a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function checkAlerts() {
      const alertContainer = document.getElementById('alert-container');
      const todayStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '/');
      let alerts = [];

      allSpecimens.forEach(item => {
        const effective = Number(item.effective_days) || 0;
        const planned = Number(item.planned_days) || 0;
        
        // 警告の判定を status に戻しました
        if (planned > 0 && effective >= planned && (item.status === "屋外暴露" || item.status === "促進耐候性試験" || item.status === "暴露期間中")) {
          alerts.push(`【目標日数到達】試験体 <b>${item.specimen_id}</b> が計画日数（${planned}日）に到達・超過しています。`);
        }
        
        const nextDate = formatDateToYMD(item.next_measurements);
        if (nextDate && nextDate === todayStr) {
          alerts.push(`【測定日当日】試験体 <b>${item.specimen_id}</b> の重量測定日です。`);
        }
      });

      if (alerts.length > 0) {
        alertContainer.innerHTML = `
          <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm">
            <div class="flex items-center mb-1"><span class="text-red-500 text-lg mr-2">⚠️</span><h3 class="text-red-800 font-bold">システム通知</h3></div>
            <ul class="list-disc list-inside text-sm text-red-700 space-y-1 ml-6">${alerts.map(a => `<li>${a}</li>`).join('')}</ul>
          </div>
        `;
        alertContainer.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
